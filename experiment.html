<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanda Sanderiana (Waling-waling)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #080810; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ── Renderer ── */
const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x080810, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080810, 0.055);

const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 100);
camera.position.set(0, 0, 9);

/* ── Lights ── */
scene.add(new THREE.AmbientLight(0x180820, 3));

const key = new THREE.PointLight(0xffd0f0, 4, 25);
key.position.set(-2, 4, 5);
scene.add(key);

const fill = new THREE.PointLight(0x8060c0, 2.5, 20);
fill.position.set(4, -2, 3);
scene.add(fill);

const rim = new THREE.PointLight(0xffe0a0, 1.5, 20);
rim.position.set(0, -5, -3);
scene.add(rim);

/* ── Petal shapes ── */
function upperPetalShape() {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo( 0.55, 0.08,  0.75, 0.55,  0.45, 1.05);
  s.bezierCurveTo( 0.20, 1.35,  -0.20, 1.35, -0.45, 1.05);
  s.bezierCurveTo(-0.75, 0.55, -0.55, 0.08,   0, 0);
  return s;
}

function lowerPetalShape() {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo( 0.65, 0.06,  0.90, 0.50,  0.55, 1.0);
  s.bezierCurveTo( 0.30, 1.30, -0.30, 1.30, -0.55, 1.0);
  s.bezierCurveTo(-0.90, 0.50, -0.65, 0.06,   0, 0);
  return s;
}

/* ── Helper: Zoom UVs toward the center, cropping texture margins ── */
function zoomUV(geometry, zoomX = 1.2, zoomY = 1.2) {
  const uvAttr = geometry.attributes.uv;
  if (!uvAttr) return;
  for (let i = 0; i < uvAttr.count; i++) {
    let u = uvAttr.getX(i);
    let v = uvAttr.getY(i);
    // Scale around (0.5, 0.5)
    u = 0.5 + (u - 0.5) * zoomX;
    v = 0.5 + (v - 0.5) * zoomY;
    uvAttr.setXY(i, u, v);
  }
  uvAttr.needsUpdate = true;
}

/* ── Load textures from real petal images ── */
const loader = new THREE.TextureLoader();
const loadTexture = (url) => new Promise((resolve) => loader.load(url, resolve));

Promise.all([
  loadTexture('petal_upper.png'),
  loadTexture('petal_lower.png')
]).then(([upperTex, lowerTex]) => {
  // Ensure clamping (transparent outside 0‑1)
  upperTex.wrapS = upperTex.wrapT = THREE.ClampToEdgeWrapping;
  lowerTex.wrapS = lowerTex.wrapT = THREE.ClampToEdgeWrapping;

  // Materials
  const matUpper = new THREE.MeshPhongMaterial({
    map: upperTex,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 1.0,
    shininess: 55,
    specular: new THREE.Color(0xffffff)
  });
  const matLower = new THREE.MeshPhongMaterial({
    map: lowerTex,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.9,
    shininess: 55,
    specular: new THREE.Color(0xffffff)
  });

  // Geometries
  const uGeo = new THREE.ShapeGeometry(upperPetalShape(), 24);
  const lGeo = new THREE.ShapeGeometry(lowerPetalShape(), 24);

  // 🔍 Zoom in the UVs so the petal fills the shape (crop transparent edges)
  zoomUV(uGeo, 1.15, 1.15);   // Adjust these numbers until the image fits perfectly
  zoomUV(lGeo, 1.15, 1.15);

  /* ── Orchid factory ── */
  function createVanda(x, y, z, scale, tilt) {
    const g = new THREE.Group();

    // Top petal (dorsal sepal)
    [0].forEach(deg => {
      const m = new THREE.Mesh(uGeo, matUpper);
      const r = (deg * Math.PI) / 180;
      m.rotation.z = -r;
      m.rotation.x = -0.18;
      m.position.set(Math.sin(r) * 0.08, Math.cos(r) * 0.08, 0);
      g.add(m);
    });

    // Horizontal petals (lateral petals)
    [-70, 70].forEach(deg => {
      const m = new THREE.Mesh(uGeo, matUpper);
      const r = (deg * Math.PI) / 180;
      m.rotation.z = -r;
      m.rotation.x = -0.0;
      m.position.set(Math.sin(r) * 0.09, Math.cos(r) * 0.09, 0.02);
      g.add(m);
    });

    // Lower two petals (lower sepals)
    [-130, 130].forEach(deg => {
      const m = new THREE.Mesh(lGeo, matLower);
      const r = (deg * Math.PI) / 180;
      m.rotation.z = -r;
      m.rotation.x = 0.0;
      m.position.set(Math.sin(r) * 0.10, Math.cos(r) * 0.10, -0.04);
      g.add(m);
    });

    g.position.set(x, y, z);
    g.scale.setScalar(scale);
    g.rotation.z = tilt || 0;
    return g;
  }

  /* ── Place flowers ── */
  const flowerData = [
    { x:  0.0, y:  0.3, z:  0.5, s: 2.20, t:  0.00 },
  ];

  const flowers = flowerData.map(d => {
    const f = createVanda(d.x, d.y, d.z, d.s, d.t);
    scene.add(f);
    return f;
  });

  /* ── Animation ── */
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.007;

    camera.position.x += (mx * 1.0 - camera.position.x) * 0.055;
    camera.position.y += (my * 0.6 - camera.position.y) * 0.055;
    camera.lookAt(0, 0, 0);

    flowers.forEach((f, i) => {
      f.rotation.y = Math.sin(t * 0.6 + i * 1.3) * 0.10;
      f.rotation.x = flowerData[i].t + Math.sin(t * 0.4 + i * 0.9) * 0.04;
      f.position.y = flowerData[i].y + Math.sin(t * 0.5 + i * 1.1) * 0.04;
    });

    key.position.x = Math.sin(t * 0.3) * 4;
    key.position.y = 4 + Math.cos(t * 0.25) * 2;
    fill.position.x = Math.cos(t * 0.28) * 5;

    renderer.render(scene, camera);
  }
  animate();
}).catch(err => console.error('Texture loading failed:', err));

/* ── Floating pollen particles ── */
const pCount = 300;
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  pPos[i*3]   = (Math.random() - 0.5) * 16;
  pPos[i*3+1] = (Math.random() - 0.5) * 12;
  pPos[i*3+2] = (Math.random() - 0.5) * 10;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
scene.add(new THREE.Points(pGeo,
  new THREE.PointsMaterial({ color: 0xe0b0d0, size: 0.035, transparent: true, opacity: 0.45 })
));

/* ── Mouse ── */
let mx = 0, my = 0;
document.addEventListener('mousemove', e => {
  mx =  (e.clientX / window.innerWidth  - 0.5) * 2;
  my = -(e.clientY / window.innerHeight - 0.5) * 2;
});

/* ── Resize ── */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
