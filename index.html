<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>waling2xek</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }

    canvas {
      display: block;
    }

    /* ── Text in the centre of the screen ── */
    #hero {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }

    #hero h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      color: #f0e8d8;
      text-transform: uppercase;
    }

    #hero p {
      margin-top: 1rem;
      font-size: clamp(0.75rem, 1.5vw, 1rem);
      letter-spacing: 0.5em;
      color: #8a7a6a;
      text-transform: uppercase;
      font-family: sans-serif;
    }

    /* ── Small hint at the bottom ── */
    #hint {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #3a3030;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="hero">
    <!-- ✏️  Change these two lines to your own name and title -->
    <h1>Enica King</h1>
    <p>Artist | Designer | Data Scientist</p>
  </div>

  <div id="hint">move your mouse · scroll to explore</div>

  <!-- Three.js library (loaded from a free CDN — no install needed) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    /* =====================================================
       SETUP  —  renderer, scene, camera
    ===================================================== */
    const W = window.innerWidth;
    const H = window.innerHeight;

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('canvas'),
      antialias: true
    });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x0a0a0f, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a0f, 0.08);

    const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 100);
    camera.position.set(0, 0, 8);


    /* =====================================================
       LIGHTS  —  gives petals their colour and shine
    ===================================================== */
    scene.add(new THREE.AmbientLight(0x1a0a20, 2));

    const pinkLight = new THREE.PointLight(0xc07090, 3, 20);
    pinkLight.position.set(-3, 3, 3);
    scene.add(pinkLight);

    const purpleLight = new THREE.PointLight(0x5040c0, 2, 20);
    purpleLight.position.set(3, -2, 2);
    scene.add(purpleLight);

    const warmLight = new THREE.PointLight(0xe0c080, 1.5, 15);
    warmLight.position.set(0, 4, -2);
    scene.add(warmLight);


    /* =====================================================
       ORCHID BUILDER
       Each orchid is made from simple shapes:
         • Petals  → flat bezier curves
         • Column  → small cylinder in the centre
         • Stem    → tube following a curved path
    ===================================================== */

    /* Build petal texture on a 2D canvas */
    function makePetalTexture(baseHex, veinHex, veinCount = 7, spots = false) {
      const size = 256;
      const cv = document.createElement('canvas');
      cv.width = cv.height = size;
      const ctx = cv.getContext('2d');
    
      // 1) Fill entire canvas with base colour
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, size, size);
    
      // 2) Draw subtle gradient from base to tip (optional, gives depth)
      const gradient = ctx.createLinearGradient(0, 0, 0, size);
      gradient.addColorStop(0, baseHex);
      gradient.addColorStop(1, 'rgba(255,255,255,0.08)');  // faint white at tip
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
    
      return new THREE.CanvasTexture(cv);
    }
    
    /* Petal shapes */
    function upperPetalShape() {     // broad rounded
      const s = new THREE.Shape();
      s.moveTo(0, 0);
      s.bezierCurveTo( 0.55, 0.08,  0.75, 0.55,  0.45, 1.05);
      s.bezierCurveTo( 0.20, 1.35,  -0.20, 1.35, -0.45, 1.05);
      s.bezierCurveTo(-0.75, 0.55, -0.55, 0.08,   0, 0);
      return s;
    }
    
    function lowerPetalShape() {    // wider, slightly triangular
      const s = new THREE.Shape();
      s.moveTo(0, 0);
      s.bezierCurveTo( 0.65, 0.06,  0.90, 0.50,  0.55, 1.0);
      s.bezierCurveTo( 0.30, 1.30, -0.30, 1.30, -0.55, 1.0);
      s.bezierCurveTo(-0.90, 0.50, -0.65, 0.06,   0, 0);
      return s;
    }
    
    /* ── Orchid ── */
    function createVanda(x, y, z, scale, tilt) {
      const g = new THREE.Group();
    
      // Textures
      const upperTex = makePetalTexture('#f2adc4', '#9040a0', 9, false); // upper petals
      const lowerTex = makePetalTexture('#4a1b28', '#6020a0', 27, true); // lower petals
    
      const matUpper = new THREE.MeshPhongMaterial({
          map: upperTex,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.9,
          shininess: 55,
          specular: new THREE.Color(0x555555)
      });
      const matLower = new THREE.MeshPhongMaterial({
          map: lowerTex,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.9,
          alphaTest: 0.1,
          shininess: 30,
          specular: new THREE.Color(0x333333)
      });
    
      /* Upper petals — top-left and top-right */
      const uGeo = new THREE.ShapeGeometry(upperPetalShape(), 24);
      [-70, 0, 70].forEach(deg => {          
        const m = new THREE.Mesh(uGeo, matUpper);
        const r = (deg * Math.PI) / 180;
        m.rotation.z = -r;
        m.rotation.x = -0.18;
        m.position.set(Math.sin(r) * 0.08, Math.cos(r) * 0.08, 0);
        g.add(m);
      });             
    
      /* Lower 2 petals — bottom-left and bottom-right, angled down */
      const lGeo = new THREE.ShapeGeometry(lowerPetalShape(), 24);
      [-130, 130].forEach(deg => {
        const m = new THREE.Mesh(lGeo, matLower);
        const r = (deg * Math.PI) / 180;
        m.rotation.z = -r;
        m.rotation.x = 0.0;           // angle slightly back
        m.position.set(Math.sin(r) * 0.10, Math.cos(r) * 0.10, -0.04);
        g.add(m);
      });
    
      g.position.set(x, y, z);
      g.scale.setScalar(scale);
      g.rotation.z = tilt || 0;
      return g;
    }

    
    /** Returns a petal-shaped flat curve */
    function petalShape(length, width) {
      const s = new THREE.Shape();
      s.moveTo(0, 0);
      s.bezierCurveTo( width * 0.7, length * 0.2,  width * 0.9, length * 0.6,  0, length);
      s.bezierCurveTo(-width * 0.9, length * 0.6, -width * 0.7, length * 0.2,  0, 0);
      return s;
    }

    /** Returns the wider lip petal (labellum) shape */
    function lipShape(length, width) {
      const s = new THREE.Shape();
      s.moveTo(0, 0);
      s.bezierCurveTo( width * 1.2, length * 0.1,  width * 1.4, length * 0.5,  0, length);
      s.bezierCurveTo(-width * 1.4, length * 0.5, -width * 1.2, length * 0.1,  0, 0);
      return s;
    }


    /* =====================================================
       PLACE ORCHIDS IN THE SCENE
       ✏️  Add, remove, or move entries to change the layout
           x = left/right,  y = up/down,  z = depth
           s = size,  h = colour hue (0–1)
    ===================================================== */
    const flowerData = [
      { x:  0.0, y:  0.3, z:  0.5, s: 2.20, t:  0.00 },
      // { x: -2.6, y:  0.8, z: -0.3, s: 1.00, t:  0.12 },
      // { x:  2.5, y:  0.5, z: -0.5, s: 1.00, t: -0.10 },
      // { x: -1.2, y: -1.4, z: -0.8, s: 0.82, t:  0.20 },
      // { x:  1.5, y: -1.2, z: -1.0, s: 0.82, t: -0.15 },
      // { x: -3.5, y: -0.6, z: -1.5, s: 0.70, t:  0.08 },
      // { x:  3.4, y:  1.1, z: -2.0, s: 0.65, t: -0.08 },
      // { x:  0.6, y:  2.0, z: -2.5, s: 0.60, t:  0.05 },
    ];

    const orchids = orchidData.map(d => {
      const o = createOrchid(d.x, d.y, d.z, d.s, d.h);
      scene.add(o);
      return o;
    });


    /* =====================================================
       FLOATING DUST PARTICLES
    ===================================================== */
    const particleCount = 200;
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      positions[i * 3]     = (Math.random() - 0.5) * 14;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 10;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 8;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    scene.add(new THREE.Points(
      dustGeo,
      new THREE.PointsMaterial({ color: 0xc0a0c0, size: 0.04, transparent: true, opacity: 0.5 })
    ));


    /* =====================================================
       MOUSE TRACKING  —  camera gently follows the cursor
    ===================================================== */
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', e => {
      mouseX =  (e.clientX / window.innerWidth  - 0.5) * 2;
      mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;
    });


    /* =====================================================
       ANIMATION LOOP
    ===================================================== */
    let time = 0;

    function animate() {
      requestAnimationFrame(animate);
      time += 0.008;

      // Camera drifts toward the mouse position slowly
      camera.position.x += (mouseX * 0.8 - camera.position.x) * 0.04;
      camera.position.y += (mouseY * 0.5 - camera.position.y) * 0.04;
      camera.lookAt(0, 0, 0);

      // Each orchid sways like it's in a gentle breeze
      orchids.forEach((orchid, i) => {
        orchid.rotation.y = Math.sin(time * 0.7 + i * 1.2) * 0.12;
        orchid.rotation.z = Math.sin(time * 0.5 + i * 0.8) * 0.06;
        orchid.position.y = orchidData[i].y + Math.sin(time * 0.6 + i) * 0.05;
      });

      // Lights slowly orbit for shifting colour
      pinkLight.position.x = Math.sin(time * 0.4) * 4;
      pinkLight.position.y = Math.cos(time * 0.3) * 3;
      purpleLight.position.x = Math.cos(time * 0.35) * 4;

      renderer.render(scene, camera);
    }

    animate();


    /* =====================================================
       HANDLE WINDOW RESIZE
    ===================================================== */
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
  </script>
</body>
</html>
